name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances de test
        run: pip install openpyxl lxml
      - name: Schémas BCF officiels (buildingSMART)
        run: git clone --depth 1 --branch release_2_1 https://github.com/buildingSMART/BCF-XML /tmp/bcf
      - name: Tests
        run: python -m unittest discover tests
        env:
          BCF_XSD_DIR: /tmp/bcf/Schemas
      - name: Archive de l'extension
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: checkers_bonsai
          path: dist/*.zip
