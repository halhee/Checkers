name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (doublures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances de test
        run: pip install openpyxl lxml
      - name: Schémas BCF officiels (buildingSMART)
        run: git clone --depth 1 --branch release_2_1 https://github.com/buildingSMART/BCF-XML /tmp/bcf
      - name: Tests
        run: python -m unittest discover tests
        env:
          BCF_XSD_DIR: /tmp/bcf/Schemas
      - name: Archive de l'extension
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: checkers_bonsai
          path: dist/*.zip

  integration:
    # Vraies bibliothèques IfcOpenShell et ifctester, sans Blender.
    # 3.11 : Python de Blender 4.2 à 5.0 ; 3.13 : Blender 5.1 et suivants.
    name: Intégration IfcOpenShell (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliothèques fournies par Bonsai
        run: pip install ifcopenshell ifctester openpyxl
      - name: Versions
        run: python -c "import ifcopenshell, openpyxl; print('ifcopenshell', ifcopenshell.version, '| openpyxl', openpyxl.__version__)"
      - name: Tests d'intégration
        run: python -m unittest discover tests_integration -v
