schema_version = "1.0.0"

id = "checkers_bonsai"
version = "0.1.0"
name = "Checkers"
tagline = "Contrôle des PSet, de l'IDS et bilan carbone du modèle IFC ouvert dans Bonsai"
maintainer = "Checkers <khchiche.zakaria@gmail.com>"
type = "add-on"
website = "https://github.com/halhee/Checkers"

tags = ["Import-Export", "Object"]

# Bonsai fournit ifcopenshell, ifctester, pandas et openpyxl : l'extension
# n'embarque aucune dépendance tierce, seulement les modules de Checkers
# (copiés dans lib/ par bonsai_extension/build.py).
blender_version_min = "4.2.0"

license = ["SPDX:MIT"]

[permissions]
files = "Lecture des fichiers de règles (Excel, IDS) et écriture du rapport Excel"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
